[project]
name = "cozmo-ai-v2"
version = "0.1.0"
description = "Prepares Stray Scanner captures or plain RGB video as MASt3R-SLAM inputs"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.scripts]
cozmo-ai-v2 = "cozmo_ai_v2.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo_ai_v2"]
