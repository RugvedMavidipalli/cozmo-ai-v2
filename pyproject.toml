[project]
name = "cozmo-ai-v2"
version = "0.1.0"
description = "Handheld capture to dimensioned floor plan: Stray Scanner / video ingestion, geometry, and scope generation"
requires-python = ">=3.10"
dependencies = [
    # numpy is held below 2 by open3d 0.19, which the reconstruction path needs.
    "numpy<2",
    "scipy>=1.10",
    # contrib build: cv2.ximgproc.guidedFilter is required by depth/fusion.py
    "opencv-contrib-python-headless>=4.9",
    "open3d==0.19.0",
    "shapely",
    "trimesh",
    "scikit-image",
    "svgwrite",
    "matplotlib",
    "pyyaml>=6.0",
    "jsonschema",
    "python-dotenv",
]

[project.scripts]
cozmo-ai-v2 = "cozmo_ai_v2.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]
# Monocular depth / SLAM front-end. Not synced by default; needs a GPU to be useful.
depth = ["torch>=2.0", "torchvision"]
# Damage detection (Track B) calls out to hosted models; geometry runs without these.
damage = ["anthropic", "replicate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cozmo_ai_v2"]

[tool.pytest.ini_options]
# tools/*_test.py are ad-hoc diagnostic scripts, not a test suite: they run
# module-level code against hardcoded capture paths. Only collect tests/.
testpaths = ["tests"]
markers = [
    "recording_regression: opt-in checks against externally supplied recording result.json files",
]
